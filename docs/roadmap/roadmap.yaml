      A general-profile roadmap.yaml with no touches and checklist gates round-trips plan / render / sync / gauntlet start-critic-ack-repair against a markdown artifact; existing engineering roadmaps work with zero edits; shims removed; full suite + packed install + both end-to-end loops green.
