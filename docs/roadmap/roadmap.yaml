# roadmap plans itself. Canonical planning state for this repo; docs/SLICES.md is rendered from it.
# Narrative: ../../ROADMAP.md · live status: STATUS.md · design: ../ARCHITECTURE.md
meta:
  schema_version: 1
  program: roadmap
  north_star: docs/ARCHITECTURE.md
  default_gate: |
    npm test
  base_branch: main
  remote: origin
  default_concurrency: 2
  discipline:
    pi_min_slices: 3
  links:
    narrative: ../../ROADMAP.md
    status: roadmap/STATUS.md
    strategy: ARCHITECTURE.md

